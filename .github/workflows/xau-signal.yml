name: xau-signal

on:
  schedule:
    - cron: "*/15 7-20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "cek = tes koneksi | analisa = kirim analisa sekarang | backtest = uji strategi 60 hari"
        type: choice
        options:
          - cek
          - analisa
          - backtest
        default: cek

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: state
          key: sig-${{ github.run_id }}
          restore-keys: sig-
      - run: pip install -r requirements.txt
      - run: python xau.py ${{ github.event.inputs.mode || 'signal' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
